[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "automation-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.18,<2.0",
  "email-validator>=2.2,<3.0",
  "fastapi>=0.115,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "pwdlib[argon2]>=0.3,<1.0",
  "pyjwt>=2.10,<3.0",
  "sqlalchemy>=2.0.51,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
test = [
  "httpx2>=2.0,<3.0",
  "mypy>=1.18,<2.0",
  "pytest>=9.0.3,<10.0",
  "ruff>=0.14,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra -q --strict-markers"
markers = [
  "unit: tests rapides et isolés utilisant SQLite ou des doubles de test",
  "integration: tests nécessitant le service PostgreSQL de test dédié",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
