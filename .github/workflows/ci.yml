name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: automation_test
          POSTGRES_USER: automation_test
          POSTGRES_PASSWORD: automation_test_password
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U automation_test -d automation_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      JWT_SECRET_KEY: ci-only-jwt-key-not-a-secret-0123456789abcdef
      DATABASE_URL: postgresql+psycopg://automation:unused_ci_value@127.0.0.1:5432/automation
      TEST_DATABASE_URL: postgresql+psycopg://automation_test:automation_test_password@127.0.0.1:55432/automation_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        working-directory: backend
        run: python -m pip install -e ".[test]"
      - name: Check formatting
        working-directory: backend
        run: ruff format --check app tests alembic scripts
      - name: Lint
        working-directory: backend
        run: ruff check app tests alembic scripts
      - name: Type check
        working-directory: backend
        run: mypy app
      - name: Unit tests
        working-directory: backend
        run: pytest -m unit
      - name: Apply Alembic migrations
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: alembic upgrade head
      - name: Integration tests
        working-directory: backend
        run: pytest -m integration
      - name: Verify Alembic head and model drift
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          alembic current
          alembic heads
          alembic check

  frontend:
    name: Frontend quality and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: ESLint
        working-directory: frontend
        run: npm run lint
      - name: TypeScript
        working-directory: frontend
        run: npm run typecheck
      - name: Component tests when configured
        working-directory: frontend
        run: npm run test:components --if-present
      - name: Build Next.js
        working-directory: frontend
        env:
          BACKEND_API_URL: http://127.0.0.1:8000
          DEFAULT_COMPANY_ID: 11111111-1111-4111-8111-111111111111
        run: npm run build

  repository-security:
    name: Repository secret policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reject tracked env files and common secret formats
        run: python scripts/check_repository_secrets.py

  e2e:
    name: End-to-end Chromium
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: automation_e2e
          POSTGRES_USER: automation_e2e
          POSTGRES_PASSWORD: e2e_database_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U automation_e2e -d automation_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      CI: "true"
      APP_ENV: test
      JWT_SECRET_KEY: ci-e2e-jwt-key-not-a-secret-0123456789abcdef
      DATABASE_URL: postgresql+psycopg://automation_e2e:e2e_database_password@127.0.0.1:5432/automation_e2e
      REDIS_URL: redis://127.0.0.1:6379/0
      BACKEND_API_URL: http://127.0.0.1:8000
      DEFAULT_COMPANY_ID: 11111111-1111-4111-8111-111111111111
      E2E_EMAIL: e2e-user@example.com
      E2E_PASSWORD: CI-Only-E2E-Password-42!
      E2E_VIEWER_EMAIL: e2e-viewer@example.com
      E2E_VIEWER_PASSWORD: CI-Only-Viewer-Password-42!
      E2E_SUPPORT_EMAIL: e2e-support@example.com
      E2E_SUPPORT_PASSWORD: CI-Only-Support-Password-42!
      E2E_SALES_PASSWORD: CI-Only-Sales-Password-42!
      E2E_FOREIGN_EMAIL: e2e-owner-b@example.com
      E2E_FOREIGN_PASSWORD: CI-Only-Owner-B-Password-42!
      E2E_COMPANY_ID: 11111111-1111-4111-8111-111111111111
      E2E_FOREIGN_COMPANY_ID: 44444444-4444-4444-8444-444444444444
      E2E_DATABASE_MARKER: automation_e2e
      API_BASE_URL: http://localhost:8000
      E2E_PLATFORM_ADMIN_PASSWORD: CI-Only-Platform-Admin-Password-42!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: python -m pip install -e ".[test]"
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Migrate and seed synthetic E2E data
        working-directory: backend
        run: |
          alembic upgrade head
          python scripts/seed_e2e.py
      - name: Start API
        run: |
          cd backend
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../backend-e2e.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then exit 0; fi
            sleep 2
          done
          cat ../backend-e2e.log
          exit 1
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run Playwright API
        working-directory: frontend
        run: npm run test:api
      - name: Run Playwright
        working-directory: frontend
        run: npm run test:e2e
      - name: Publish Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            frontend/playwright-report/
            frontend/playwright-report-api/
            frontend/test-results/
            backend-e2e.log
